<!doctype html>
<html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gráficos do assistente · QA</title>
<body><div id="root"></div><script type="module">
import React, { useState } from 'react'
import { createRoot } from 'react-dom/client'
import { MemoryRouter } from 'react-router-dom'
import MessageBubble from '../src/assistant/chat/MessageBubble.jsx'
import { salesFacts, chartReply } from '../functions/src/assistantCharts.js'
import '../src/index.css'
import '../src/theme/operations.css'
import '../src/assistant/chat/chat.css'
const h = React.createElement
// Fictional aggregates only; no credentials or provider requests.
const rows = Array.from({ length: 12 }, (_, index) => ({ date: `2026-10-${String(index + 1).padStart(2, '0')}`, source: 'pieces', person: 'Pessoa de QA', channel: index % 2 ? 'WEB' : 'VAREJO', store: 'ARA', value: 1000 + index * 70 }))
function Fixture() {
  const [question, setQuestion] = useState('Gráficos de vendas desse mês')
  const context = { month: '10/2026', sales: salesFacts(rows, '10/2026', question) }
  const message = { id: 'qa', role: 'assistant', provider: 'gemini', status: 'complete', text: 'Gráficos de QA com o mesmo componente do BI. Nenhuma chamada externa.', ...chartReply(context, question) }
  return h('main', { style: { maxWidth: 780, margin: 'auto', padding: 12 } },
    h('div', { style: { display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 20 } },
      h('button', { onClick: () => document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark') }, 'Alternar tema'),
      h('label', { style: { display: 'grid', maxWidth: '100%', minWidth: 0 } }, 'Pedido de teste ', h('select', { style: { maxWidth: '100%', minWidth: 0 }, value: question, onChange: event => setQuestion(event.target.value) }, ...['Gráficos de vendas desse mês', 'Gráfico acumulado por dia', 'Pizza por setor', 'Ranking de vendas', 'Gráficos de 09/2026'].map(value => h('option', { key: value }, value))))),
    h(MessageBubble, { key: question, message, index: 0, voice: { canRead: false }, onVote: () => {}, onRetry: () => {}, onClose: () => {} }))
}
createRoot(document.getElementById('root')).render(h(MemoryRouter, null, h(Fixture)))
</script></body></html>
